name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A version can never be republished, so a tag pointing at one that is
      # already live should be a clean no-op rather than a red build.
      - id: check
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "beautiful-qr@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "beautiful-qr@$version is already on the registry, skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm trusts this workflow directly and mints a
      # short-lived credential, so there is no NPM_TOKEN to store or rotate.
      # Configure it once under the package's settings on npmjs.com.
      #
      # npm stages this rather than making it live. Approve it under Staged
      # Packages on npmjs.com, or with `npm stage approve <id>` on npm 11.15+.
      - if: steps.check.outputs.published == 'false'
        run: npm publish
