name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Trusted publishing: npm trusts this workflow directly and mints a
      # short-lived credential, so there is no NPM_TOKEN to store or rotate.
      # Configure it once under the package's settings on npmjs.com.
      - run: npm publish
