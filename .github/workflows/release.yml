name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 bundles npm 10.9, which has no `npm stage` command. Staged
      # publishing needs 11.15 or newer.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A version can never be republished, so a tag pointing at one that is
      # already live should be a clean no-op rather than a red build.
      - id: check
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "beautiful-qr@$version" version >/dev/null 2>&1; then
            echo "staged=false" >> "$GITHUB_OUTPUT"
            echo "beautiful-qr@$version is already on the registry, skipping"
          else
            echo "staged=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing authenticates this workflow over OIDC, so there is
      # no NPM_TOKEN to store or rotate.
      #
      # This stages only. The trusted publisher is deliberately not granted
      # `npm publish`, so nothing reaches users until a maintainer approves it
      # with 2FA under Staged Packages on npmjs.com, or via `npm stage approve`.
      # A compromised workflow can therefore upload, but never ship.
      - if: steps.check.outputs.staged == 'true'
        run: npm stage publish

      - if: steps.check.outputs.staged == 'true'
        run: |
          echo "### Staged, awaiting approval" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve it to go live:" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://www.npmjs.com/package/beautiful-qr/access" >> "$GITHUB_STEP_SUMMARY"
          echo '- or `npm stage list` then `npm stage approve <id>`' >> "$GITHUB_STEP_SUMMARY"
